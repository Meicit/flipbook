<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flipbook từ PDF — chạy trên GitHub Pages</title>
  <style>
    body{font-family: Arial, sans-serif; background:#f2f2f2; margin:0; padding:20px;}
    .controls{margin-bottom:12px}
    #flipbook-wrapper{width:100%; max-width:1000px; margin:0 auto;}
    #flipbook{width:800px; height:600px;}
    .page{width:400px; height:600px; overflow:hidden;}
    canvas{display:block; width:100%; height:100%;}
    .loader{font-size:14px; color:#444}
    @media (max-width:900px){
      #flipbook{width:320px; height:480px}
      .page{width:160px; height:480px}
      canvas{height:480px}
    }
  </style>
  <!-- jQuery needed by turn.js -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- turn.js (page flip) -->
  <script src="https://cdn.jsdelivr.net/gh/blasten/turn.js@4/turn.min.js"></script>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
  <h2>Flipbook từ PDF (dùng trên GitHub Pages)</h2>
  <div class="controls">
    <label>PDF (file trong repo): </label>
    <input id="pdfPath" type="text" placeholder="ví dụ: document.pdf" style="width:250px" value="document.pdf">
    <button id="loadBtn">Tải flipbook</button>
    <span class="loader" id="status"></span>
  </div>

  <div id="flipbook-wrapper">
    <div id="flipbook"></div>
  </div>

  <script>
    // Cấu hình PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    async function renderPDFtoFlipbook(url){
      $('#status').text('Đang tải PDF...');
      const pdf = await pdfjsLib.getDocument(url).promise;
      const numPages = pdf.numPages;
      $('#status').text('PDF tải xong — ' + numPages + ' trang. Đang render...');

      // Xoá flipbook cũ nếu có
      $('#flipbook').turn('destroy').empty();

      // Tạo các page (mỗi page của flipbook = 1 trang PDF hoặc 2 trang tuỳ chiều)
      for(let i=1;i<=numPages;i++){
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 1.6 }); // scale thay đổi độ phân giải
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({canvasContext: context, viewport: viewport}).promise;

        const pageWrapper = document.createElement('div');
        pageWrapper.className = 'page';
        // Đưa canvas vào trong div
        pageWrapper.appendChild(canvas);
        // Thêm vào flipbook
        $('#flipbook').append(pageWrapper);
      }

      $('#status').text('Render xong. Khởi tạo flipbook...');

      // Khởi tạo turn.js
      $('#flipbook').turn({
        width: $('#flipbook').innerWidth(),
        height: Math.max(480, $(window).height()*0.6),
        autoCenter: true,
        elevation: 50,
        gradients: true,
        duration: 600
      });

      $('#status').text('Sẵn sàng — dùng mũi tên hoặc kéo để lật trang.');
    }

    // Nút load
    $('#loadBtn').on('click', function(){
      const path = $('#pdfPath').val().trim();
      if(!path){ alert('Nhập đường dẫn tới file PDF trong repo (ví dụ: document.pdf)'); return; }
      // Kích hoạt render
      renderPDFtoFlipbook(path).catch(err=>{
        console.error(err);
        $('#status').text('Lỗi: ' + err.message);
      });
    });

    // Nếu muốn tự động load khi mở trang (file document.pdf nằm trong repo)
    $(function(){
      // Nếu tồn tại ?pdf=... trong URL thì dùng nó
      const params = new URLSearchParams(window.location.search);
      const pdfParam = params.get('pdf');
      if(pdfParam){ $('#pdfPath').val(pdfParam); $('#loadBtn').click(); }
    });
  </script>

  <p style="margin-top:18px; font-size:13px; color:#666">Hướng dẫn nhanh: đặt file PDF (ví dụ <code>document.pdf</code>) vào thư mục cùng file HTML trong repo, chỉnh <code>pdfPath</code> nếu cần và bật GitHub Pages trên nhánh <code>main</code> hoặc <code>gh-pages</code>.</p>
</body>
</html>
